appId: com.raphael.klearning
---
# Test: Google Login öffnet das native ASWebAuthenticationSession-Sheet
# und kein externer Safari/WebView bleibt zurück

- launchApp:
    clearState: true

- assertVisible:
    text: ".*Mit Google anmelden.*"

# Google-Button tippen
- tapOn:
    text: ".*Mit Google anmelden.*"

# iOS zeigt zuerst den System-Dialog der Auth-Session ("... möchte zum Anmelden "supabase.co" verwenden").
# Das belegt: natives Sheet statt externem Safari-Tab.
- extendedWaitUntil:
    visible: ".*supabase\\.co.*"
    timeout: 15000

- takeScreenshot: google_auth_sheet

# Auf iOS gibt es kein "Back": Sheet über "Abbrechen" (de) bzw. "Cancel" (en) schliessen
- tapOn:
    text: "Abbrechen|Cancel"

# App ist noch da (kein Crash, kein Browser-Leak)
- extendedWaitUntil:
    visible: ".*Mit Google anmelden.*"
    timeout: 15000

- assertNotVisible:
    text: ".*supabase\\.co.*"

- takeScreenshot: after_google_cancel

appId: com.raphael.klearning
---
# Test: Prüfungen-Tab listet Prüfungen; eine Prüfung startet, Antwort wählen, Weiter, Abbrechen
# Nicht-destruktiv: Abbruch über "Prüfung abbrechen?" verwirft nur den laufenden Versuch, es wird nichts abgegeben

- runFlow: e2e_login.yaml

- tapOn: "Prüfungen, tab.*"
- assertVisible: "Makro II"
- assertVisible: ".*Probeklausur FS26.*"

- tapOn: ".*Probeklausur FS26.*"

# Prüfungs-Runner: Fortschritt, Timer, Frage mit Antwortoptionen
- extendedWaitUntil:
    visible: "Frage 1 von [0-9]+"
    timeout: 20000
- assertVisible: "A\\. .*"

# Antwort wählen, weiter zur nächsten Frage
- tapOn: "A\\. .*"
- tapOn: "Nächste Frage"
- extendedWaitUntil:
    visible: "Frage 2 von [0-9]+"
    timeout: 10000

- takeScreenshot: exam_question_2

# Beenden (Bestätigungsdialog, destruktiv), zurück auf die Prüfungsliste
- tapOn: "Prüfung beenden"
- extendedWaitUntil:
    visible: "Prüfung beenden\\?"
    timeout: 10000
- tapOn:
    text: "Beenden"
    rightOf:
      text: "Abbrechen"
- extendedWaitUntil:
    visible: "Makro II"
    timeout: 10000

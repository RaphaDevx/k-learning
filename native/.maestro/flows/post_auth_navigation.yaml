appId: com.raphael.klearning
---
# Test: Nach Login mit dem Testuser ist die Tab-Bar sichtbar und jeder Tab öffnet seinen Screen
# Braucht einen Build mit capability "e2e_login"
# Hinweis: Apple/Google Sign-In ist im Simulator nicht automatisierbar, daher Testuser-Login

- runFlow: e2e_login.yaml

- assertVisible: "Home, tab.*"
- assertVisible: "Feed, tab.*"
- assertVisible: "Karten, tab.*"
- assertVisible: "Prüfungen, tab.*"
- assertVisible: "Profil, tab.*"

# Jeder Tab zeigt seinen eigenen Inhalt
- tapOn: "Home, tab.*"
- assertVisible: "Meine Kurse"

- tapOn: "Karten, tab.*"
- assertVisible: "Flashcards"

- tapOn: "Prüfungen, tab.*"
- assertVisible: "Makro II"

- tapOn: "Profil, tab.*"
- assertVisible: "LERNSTATISTIK"

- tapOn: "Feed, tab.*"
- assertVisible: "✅ Kapiert"

- takeScreenshot: tab_bar_visible
